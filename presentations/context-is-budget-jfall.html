<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Context Is a Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* LangChain brand tokens. Offline, the fonts fall back to system fonts and the auto-fit adjusts. */
:root{
  --lc-dark:#030710; --lc-card:#0B1120; --lc-card-alt:#E5F4FF; --lc-surface:#F2FAFF;
  --lc-border:#B8DFFF; --lc-border-dark:#1A2740; --lc-muted:#6B8299; --lc-body:#C8DDF0;
  --lc-white:#FFFFFF; --lc-dark-text:#030710;
  --lc-blue:#7FC8FF; --lc-blue-hover:#99D4FF; --lc-blue-bg:#E5F4FF; --lc-blue-bg-alt:#F2FAFF;
  --lc-lime:#E3FF8F; --lc-rose:#B27D75; --lc-pink:#C78EAD; --lc-lavender:#D5C3F7;
  /* tints of the brand colours on the dark background */
  --lc-code:#060B17; --lc-kbd:#111A2E; --lc-blue-tint:rgba(127,200,255,.10); --lc-blue-line:rgba(127,200,255,.38);
  --font:"Lausanne","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lc-dark);color:var(--lc-body);font-family:var(--font)}
code,pre,.kbd{font-family:var(--mono)}
a{color:var(--lc-blue)}
b,strong{color:var(--lc-white);font-weight:600}

/* A 1280×720 canvas, scaled to fill the screen (letterboxed in the background colour). */
.stage{position:fixed;inset:0;overflow:hidden}
body:not(.ui) .stage{cursor:none}
.canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}

/* Slide = fixed header (eyebrow + h2) + .body. The body is scaled by --k so it fills the free space;
   every body size below is "design px × --u". */
.slide{position:absolute;inset:0;padding:64px 104px 56px;display:none;flex-direction:column;overflow:hidden;
  --k:1;--u:calc(1px * var(--k));--uc:calc(1px * (.4 + .6 * var(--k)))}
.slide.active{display:flex;animation:fade .25s ease}
.slide.fitting{display:flex;visibility:hidden}
.slide.has-demo{padding-bottom:96px}
body.no-cues .slide.has-demo{padding-bottom:56px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide>.body{flex:1 0 auto;display:flex;flex-direction:column;min-width:0}
.body>*{flex-shrink:0}
.body>:first-child{margin-top:auto!important}
.body>:last-child{margin-bottom:auto!important}
.slide .notes{display:none}

.eyebrow{color:var(--lc-blue);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:700;line-height:1.2;margin-bottom:12px}
.slide>h2{font-size:44px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--lc-white);margin:0 0 22px}
.body h3{font-size:calc(21 * var(--u));font-weight:700;line-height:1.3;letter-spacing:-.01em;color:var(--lc-white);margin:calc(16 * var(--u)) 0 calc(8 * var(--u))}
.body p{font-size:calc(19 * var(--u));line-height:1.55;margin:0 0 calc(12 * var(--u))}
.body .lead{font-size:calc(23 * var(--u));line-height:1.45}
.body ul{margin:0 0 calc(12 * var(--u));padding-left:calc(22 * var(--u))}
.body li{font-size:calc(18 * var(--u));line-height:1.45;margin:calc(6 * var(--u)) 0}
.body li::marker{color:var(--lc-blue)}
.body small,.muted{color:var(--lc-muted)}
.body p.muted{font-size:calc(16 * var(--u))}

.grid{display:grid;gap:calc(18 * var(--u))}
.cols-2,.split{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-2.code-left{grid-template-columns:1.4fr 1fr}
.cols-2.code-right{grid-template-columns:1fr 1.4fr}
.split{display:grid;gap:calc(18 * var(--u))}
.grid>*,.split>*{min-width:0}

.card{background:var(--lc-card);border:1px solid var(--lc-border-dark);border-radius:calc(16 * var(--u));padding:calc(22 * var(--u))}
.card h3{margin-top:0}
.card.good{border-left:3px solid var(--lc-lime)} .card.good h3{color:var(--lc-lime)}
.card.bad{border-left:3px solid var(--lc-rose)}  .card.bad h3{color:var(--lc-rose)}
.card.warn{border-left:3px solid var(--lc-lavender)} .card.warn h3{color:var(--lc-lavender)}
.card.pattern{border:1px dashed var(--lc-blue-line)}
.card h3:only-of-type:last-child{margin-bottom:0}
.card>:last-child{margin-bottom:0}

.tag{display:inline-block;font-size:calc(12 * var(--u));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--lc-blue);background:var(--lc-blue-tint);padding:calc(4 * var(--u)) calc(12 * var(--u));border-radius:100px;margin-bottom:calc(10 * var(--u))}
.kbd{background:var(--lc-kbd);border:1px solid var(--lc-border-dark);border-radius:6px;padding:.05em .4em;font-size:.84em;color:var(--lc-white);white-space:nowrap}
pre{background:var(--lc-code);border:1px solid var(--lc-border-dark);border-radius:calc(10 * var(--u));
  padding:calc(14 * var(--uc)) calc(16 * var(--uc));font-size:calc(15 * var(--uc));line-height:1.55;margin:0;color:var(--lc-body);overflow:hidden}
pre.meter{font-size:calc(19 * var(--uc));color:var(--lc-white);border-color:var(--lc-blue-line)}

table{width:100%;border-collapse:collapse;font-size:calc(17 * var(--u))}
th,td{text-align:left;vertical-align:top;padding:calc(10 * var(--u)) calc(12 * var(--u));border-bottom:1px solid var(--lc-border-dark)}
th{color:var(--lc-muted);font-weight:700;font-size:calc(12 * var(--u));text-transform:uppercase;letter-spacing:.1em}
table.compact{font-size:calc(15.5 * var(--u))}
table.compact td,table.compact th{padding:calc(7 * var(--u)) calc(10 * var(--u))}
table.compact td:first-child{color:var(--lc-blue);font-weight:700}
tr.total-row td{font-weight:700;font-size:calc(21 * var(--u));color:var(--lc-white);border-bottom:none}

.metric{font-size:calc(44 * var(--u));font-weight:800;letter-spacing:-.03em;color:var(--lc-blue);line-height:1}
.metric small{display:block;font-size:calc(12 * var(--u));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lc-muted);margin-top:calc(8 * var(--u))}
.card .metric{margin-top:calc(14 * var(--u))}
.card>.metric:first-child{margin-top:0;margin-bottom:calc(12 * var(--u))}
.measure{display:inline-block;border:2px dashed var(--lc-pink);border-radius:8px;padding:0 .3em;color:var(--lc-pink)}
.feature{font-size:calc(22 * var(--u));line-height:1.45;color:var(--lc-white);padding:calc(16 * var(--u)) calc(20 * var(--u));
  border-radius:calc(12 * var(--u));background:var(--lc-blue-tint);border-left:3px solid var(--lc-blue)}

/* geometric line icons (stroke only) */
.ico{display:block;width:calc(30 * var(--u));height:calc(30 * var(--u));color:var(--lc-blue);margin-bottom:calc(12 * var(--u))}
.ico svg{display:block;width:100%;height:100%}
ul.check{list-style:none;padding-left:0}
ul.check li{position:relative;padding-left:1.6em}
ul.check li::before{content:"";position:absolute;left:0;top:.28em;width:.8em;height:.8em;border:1.5px solid var(--lc-blue);border-radius:3px}

/* Ralph loop + plan/build/review diagrams */
.loop{display:flex;align-items:stretch;gap:calc(10 * var(--u));margin:0 0 calc(20 * var(--u))}
.loop .node{flex:1;background:var(--lc-card);border:1px solid var(--lc-blue-line);border-radius:calc(14 * var(--u));
  padding:calc(14 * var(--u)) calc(12 * var(--u));text-align:center;font-weight:600;font-size:calc(17 * var(--u));line-height:1.3;color:var(--lc-white)}
.loop .node i{display:block;font-style:normal;font-size:calc(12 * var(--u));font-weight:700;letter-spacing:.1em;color:var(--lc-blue);margin-bottom:calc(6 * var(--u))}
.loop .arr{align-self:center;color:var(--lc-blue);font-size:calc(22 * var(--u));font-weight:700}
.hand{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:calc(12 * var(--u));margin:0 0 calc(18 * var(--u))}
.hand .ag{background:var(--lc-card);border:1px solid var(--lc-border-dark);border-radius:calc(14 * var(--u));
  padding:calc(16 * var(--u));text-align:center;font-size:calc(20 * var(--u));color:var(--lc-white)}
.hand .ag small{font-size:calc(14 * var(--u))}
.hand .ag.lead{border-color:var(--lc-blue)}
.hand .ar{align-self:center;color:var(--lc-blue);font-size:calc(22 * var(--u));font-weight:700}

/* title slides */
.title-slide>.body{align-items:center;text-align:center}
.slide>h2,.title-slide h1,.title-slide .lead,.body .lead{text-wrap:balance}
.title-slide .eyebrow{font-size:calc(14 * var(--u));margin-bottom:calc(16 * var(--u))}
.title-slide h1{font-size:calc(68 * var(--u));font-weight:800;line-height:1.08;letter-spacing:-.03em;color:var(--lc-white);margin:0 0 calc(20 * var(--u))}
.title-slide .lead{font-size:calc(24 * var(--u));max-width:calc(900 * var(--u))}
/* speaker: name and role | divider | company logo, in a soft pill */
.speaker{display:flex;align-items:center;gap:calc(18 * var(--u));margin-top:calc(38 * var(--u));
  padding:calc(9 * var(--u)) calc(22 * var(--u));border:1px solid var(--lc-border-dark);border-radius:100px;background:rgba(11,17,32,.7)}
.speaker .who{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:calc(2 * var(--u))}
.speaker .name{font-size:calc(17 * var(--u));font-weight:700;letter-spacing:-.01em;color:var(--lc-white);line-height:1.2}
.speaker .role{font-size:calc(10 * var(--u));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lc-blue);line-height:1.2}
.speaker .sep{width:1px;align-self:stretch;background:var(--lc-blue-line)}
.speaker .org{display:block;color:var(--lc-white);height:calc(21 * var(--u))}
.speaker .org svg{display:block;height:100%;width:auto}
.decor{position:absolute;inset:0;overflow:hidden;color:var(--lc-blue);opacity:.28;pointer-events:none}
.decor svg{position:absolute;top:-70px;right:-70px;width:420px;height:420px}
.footer{position:absolute;left:104px;bottom:30px;font-size:12px;color:var(--lc-muted)}
.qr{background:#fff;padding:8px;border-radius:10px}
.qr svg{display:block;width:100%;height:100%}
.qr-corner{position:absolute;right:72px;bottom:56px;width:128px;text-align:center}
.qr-corner small{display:block;margin-top:6px;font-size:11px;color:var(--lc-muted)}
.qr-big{display:flex;align-items:center;gap:calc(26 * var(--u));margin-top:calc(26 * var(--u));text-align:left}
.qr-big .qr{width:calc(190 * var(--u));height:calc(190 * var(--u))}
.qr-big p{font-size:calc(24 * var(--u));margin:0;color:var(--lc-white)}

/* demo cues: one line at the bottom of the slide (D toggles), full steps in the presenter view */
.slide .demo{position:absolute;left:104px;right:104px;bottom:26px;display:flex;align-items:baseline;gap:10px;
  font-size:15px;line-height:1.4;color:var(--lc-muted);background:var(--lc-card);
  border:1px dashed #2A3A57;border-radius:10px;padding:7px 12px}
.slide .demo>:not(.cue){display:none}
body.no-cues .slide .demo{display:none}
.slide .demo code{white-space:nowrap}
.demo::before{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;color:var(--lc-dark-text);background:var(--lc-blue)}
.demo[data-kind="live"]::before{content:"▶ live"}
.demo[data-kind="recorded"]::before{content:"▶ recording";background:var(--lc-lavender)}
.demo[data-kind="show"]::before{content:"show";background:var(--lc-lime)}
.demo code{font-size:.92em;color:var(--lc-white)}

/* navigation: hidden until the mouse moves; a thin progress line is always there */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;background:rgba(11,17,32,.94);border-top:1px solid var(--lc-border-dark);opacity:0;transition:opacity .2s}
body.ui .bar,.bar:hover,body.presenter .bar{opacity:1}
.bar .nav{display:flex;gap:8px}
.progress{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:4;background:rgba(127,200,255,.12)}
.progress i{display:block;height:100%;width:0;background:var(--lc-blue);transition:width .3s}
body.presenter .progress{display:none}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lc-border-dark);cursor:pointer}
.dot.active{background:var(--lc-blue)}
.counter{font-variant-numeric:tabular-nums;color:var(--lc-muted);font-size:13px}
button{font-family:inherit;font-size:14px;font-weight:600;background:var(--lc-card);color:var(--lc-body);
  border:1px solid var(--lc-border-dark);border-radius:8px;padding:8px 16px;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--lc-blue-line)}
button.primary{background:var(--lc-blue);color:var(--lc-dark-text);border-color:var(--lc-blue)}
button.primary:hover{background:var(--lc-blue-hover)}

/* presenter view: open with P, or ?presenter */
#presenter{display:none}
body.presenter .stage{display:none}
body.presenter #presenter{display:flex;flex-direction:column;gap:14px;position:fixed;inset:0 0 58px;padding:28px 40px;overflow:auto}
#presenter .p-top{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
#pTimer{font-size:56px;font-weight:800;letter-spacing:-.02em;color:var(--lc-white);font-variant-numeric:tabular-nums}
#pCue{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#pCue.ok{color:var(--lc-lime)} #pCue.late{color:var(--lc-pink)}
#pTitle{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--lc-white)}
#pNext{font-size:18px;color:var(--lc-muted)}
#pNotes{font-size:24px;line-height:1.5;max-width:1100px}
#pHelp{font-size:13px;color:var(--lc-muted)}
#pDemo{display:none;max-width:1100px;border:1px dashed var(--lc-blue-line);background:var(--lc-card);border-radius:14px;padding:16px 20px}
#pDemo.on{display:block}
#pDemo::before{display:inline-block;margin-bottom:10px}
#pDemo .cue{font-size:20px;line-height:1.45;margin-bottom:8px}
#pDemo ol{margin:0 0 8px;padding-left:28px}
#pDemo li{font-size:21px;line-height:1.45;margin:6px 0}
#pDemo li::marker{color:var(--lc-blue)}
#pDemo p{font-size:17px;margin:6px 0 0;color:var(--lc-muted)}
#pDemo .say{quotes:none;background:var(--lc-blue-tint);color:var(--lc-white);border-radius:6px;padding:1px 6px;cursor:copy}
#pDemo .say:hover{outline:1px solid var(--lc-blue)}
#pDemo .say.copied{background:var(--lc-lime);color:var(--lc-dark-text)}

/* calculator (appendix) */
.calc{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(20 * var(--u))}
.calc label{display:block;font-size:calc(13 * var(--u));font-weight:600;color:var(--lc-muted);margin:calc(10 * var(--u)) 0 calc(4 * var(--u))}
.calc input,.calc select{width:100%;padding:calc(9 * var(--u)) calc(12 * var(--u));border-radius:8px;border:1px solid var(--lc-border-dark);
  background:var(--lc-code);color:var(--lc-white);font-family:inherit;font-size:calc(15 * var(--u))}
.calc input:focus,.calc select:focus{outline:none;border-color:var(--lc-blue)}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:calc(10 * var(--u))}
.calc .results{display:flex;flex-direction:column;gap:calc(10 * var(--u))}
.calc .res-row{display:flex;justify-content:space-between;align-items:baseline;padding:calc(12 * var(--u)) calc(16 * var(--u));
  background:var(--lc-card);border:1px solid var(--lc-border-dark);border-radius:calc(10 * var(--u))}
.calc .lbl{font-size:calc(14 * var(--u));color:var(--lc-muted)}
.calc .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:calc(19 * var(--u));color:var(--lc-white)}
.calc .res-row.total{background:var(--lc-blue-tint);border-color:var(--lc-blue-line)}
.calc .res-row.total .val{color:var(--lc-blue);font-size:calc(26 * var(--u))}
.calc .savings{padding:calc(12 * var(--u)) calc(16 * var(--u));background:var(--lc-card);border:1px solid var(--lc-border-dark);
  border-left:3px solid var(--lc-lime);border-radius:calc(10 * var(--u));font-size:calc(15 * var(--u));line-height:1.5}
.calc .savings b{color:var(--lc-lime)}
.toggle-row{display:flex;gap:8px}
.toggle-row button{flex:1;font-size:calc(14 * var(--u))}
.toggle-row button.on{background:var(--lc-blue);color:var(--lc-dark-text);border-color:var(--lc-blue)}

/* PDF / print (?print=1 or Cmd+P): every slide on its own 16:9 page; no cues, notes or navigation */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stage,.canvas{position:static;transform:none!important;width:1280px;height:auto;overflow:visible}
  .slide{position:relative;display:flex!important;visibility:visible!important;width:1280px;height:720px;
    background:var(--lc-dark);break-after:page;animation:none}
  .slide:last-child{break-after:auto}
  .slide .demo,.footer,.bar,.progress,#presenter{display:none!important}
}
</style>
</head>
<body>
<div class="deck">
  <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
  <div id="presenter">
    <div class="p-top"><div id="pTimer">0:00</div><div id="pCue"></div></div>
    <div id="pTitle"></div>
    <div id="pNext"></div>
    <div id="pDemo" class="demo"></div>
    <div id="pNotes"></div>
    <div id="pHelp">← → navigate (both windows follow) · T restart timer · D demo cues on the slides: <b id="pCues">on</b> · click a highlighted prompt to copy it</div>
  </div>
  <div class="progress"><i id="progress"></i></div>
  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="counter"><span id="cur">1</span> / <span id="total">1</span></div>
    <div class="nav">
      <button id="prev">← Prev</button>
      <button class="primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>

  `<section class="slide" data-cue="34:00">

    <p class="lead">Compaction is automatic. <b>When</b> you reset is your call, and the options cost very different amounts.</p>
    <table style="margin-top:calc(8 * var(--u))">
      <thead><tr><th>Action</th><th>Cost</th><th>Use it when</th></tr></thead>
      <tbody>
        <tr><td><span class="kbd">/clear</span></td><td><b>Free</b></td><td>Switching to an unrelated task</td></tr>
        <tr><td><span class="kbd">/rewind</span></td><td>Small: reuses the cache</td><td>The last turns went the wrong way</td></tr>
        <tr><td><span class="kbd">/compact &lt;focus&gt;</span></td><td>Reads the whole conversation</td><td>Mid-task, continuing with less</td></tr>
        <tr><td>Auto-compaction</td><td>Same, at a moment you didn't choose</td><td>You forgot the other three</td></tr>
      </tbody>

          <li>A status line with context %, cache % and cost.</li>
          <li>A hook that trims test and build output.</li>
          <li>Delete dead code. Deny generated folders.</li>
          <li>Model at session start; <span class="kbd">/clear</span> between tasks.</li>
        </ul>
      </div>
      <div class="card">
        <h3>This month</h3>
        <ul class="check">
          <li>Scoped rules with narrow globs; workflows into skills and subagents.</li>
          <li>Haiku subagents for search and summaries.</li>
          <li>A headless Ralph loop over a backlog of chores.</li>
          <li>Planner → implementer → reviewer on one real feature.</li>
          <li><span class="kbd">--max-budget-usd</span> on every headless run; spend limits for the team.</li>
          <li><span class="kbd">npm run lint:context</span> in CI.</li>
        </ul>
      </div>
    </div>
  </section>`,

  // 28 — references
  `<section class="slide">
    <div class="eyebrow">Appendix · further reading</div>
    <h2>References</h2>
    <div class="grid cols-2">
      <div class="card">
        <h3>Context and cost</h3>
        <ul>
          <li><a href="https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents">Anthropic — Effective context engineering for AI agents</a></li>
          <li><a href="https://code.claude.com/docs/en/costs">Claude Code — Manage costs effectively</a></li>
          <li><a href="https://code.claude.com/docs/en/prompt-caching">Claude Code — How Claude Code uses prompt caching</a></li>
          <li><a href="https://research.trychroma.com/context-rot">Chroma — Context Rot</a></li>
          <li><a href="https://platform.claude.com/docs/en/about-claude/pricing">Claude — Pricing</a></li>
          <li><a href="https://code.visualstudio.com/blogs/2026/06/17/improving-token-efficiency-in-github-copilot">VS Code — Improving token efficiency in GitHub Copilot</a></li>
        </ul>
      </div>
      <div class="card">
        <h3>Patterns and tools</h3>
        <ul>
          <li><a href="https://ghuntley.com/ralph/">Geoffrey Huntley — Ralph Wiggum as a "software engineer"</a></li>
          <li><a href="https://code.claude.com/docs/en/sub-agents">Claude Code — Subagents</a> · <a href="https://code.claude.com/docs/en/hooks">Hooks</a> · <a href="https://code.claude.com/docs/en/memory">Memory &amp; AGENTS.md</a></li>
          <li><a href="https://cognition.ai/blog/dont-build-multi-agents">Cognition — Don't build multi-agents</a></li>
          <li><a href="https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/">GitHub — Copilot is moving to usage-based billing</a></li>
          <li><a href="https://github.blog/ai-and-ml/github-copilot/getting-more-from-each-token-how-copilot-improves-context-handling-and-model-routing/">GitHub — Getting more from each token</a></li>
        </ul>
      </div>
    </div>
  </section>`
];

const canvas = document.getElementById('canvas');
const dots  = document.getElementById('dots');
const cur   = document.getElementById('cur');
const tot   = document.getElementById('total');

canvas.innerHTML = slides.join('');
const slideEls = [...canvas.querySelectorAll('.slide')];
tot.textContent = slideEls.length;
const isPresenter = new URLSearchParams(location.search).has('presenter');

// Scale the 1280×720 canvas to fill the window, centred.
function scaleCanvas(){
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  canvas.style.transform = `translate(${(innerWidth - 1280 * s) / 2}px, ${(innerHeight - 720 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', scaleCanvas);
scaleCanvas();

// Everything after the header (eyebrow + h2) goes into .body; title slides are all body.
slideEls.forEach(el => {
  const body = document.createElement('div');
  body.className = 'body';
  let header = !el.classList.contains('title-slide');
  [...el.children].forEach(c => {
    if (header && c.matches('.eyebrow, h2')) return;
    header = false;
    if (!c.matches('aside, .qr-corner, .footer, .decor')) body.appendChild(c);
  });
  el.appendChild(body);
  if (el.querySelector(':scope > .demo')) el.classList.add('has-demo');
});

// Auto-fit: the largest --k (body scale) at which the body still fits the free space.
// The canvas is a fixed size, so the result doesn't depend on the screen.
const FIT = { min: 0.7, max: 1.4, title: 1.15, fill: 0.92 };   // fill: share of the free height content may use
function fitSlide(el){
  const body = el.querySelector(':scope > .body');
  el.classList.add('fitting');
  const strip = el.querySelector(':scope > .demo');   // reserve the cue strip's real height (one or two lines)
  el.style.paddingBottom = strip && strip.offsetHeight ? (strip.offsetHeight + 26 + 28) + 'px' : '';
  const fits = k => {
    el.style.setProperty('--k', k);
    const avail = el.clientHeight - parseFloat(getComputedStyle(el).paddingBottom) - body.offsetTop;
    const kids = body.children, last = kids[kids.length - 1];
    if (last.offsetTop + last.offsetHeight - kids[0].offsetTop > avail * FIT.fill) return false;
    if (el.scrollWidth > el.clientWidth + 1) return false;
    // nothing may stick out of its box (code lines, unbreakable inline code); form controls excepted
    return [...body.querySelectorAll('*')].every(n => !n.clientWidth || n.matches('select, input, button') || n.scrollWidth <= n.clientWidth + 1);
  };
  let lo = FIT.min, hi = el.classList.contains('title-slide') ? FIT.title : FIT.max;
  if (fits(hi)) lo = hi;
  else if (fits(lo)) for (let n = 0; n < 10; n++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
  el.style.setProperty('--k', lo);   // not rounded: rounding up can cross a line-wrap
  el.classList.remove('fitting');
}
function fitAll(){ if (!isPresenter) slideEls.forEach(fitSlide); }
if (document.fonts) {
  document.fonts.ready.then(fitAll);
  document.fonts.addEventListener('loadingdone', fitAll);   // a slide's mono font may load later
}

// Navigation bar shows while the mouse moves; the progress line covers the main talk, not the appendix.
let uiTimer;
addEventListener('mousemove', () => {
  document.body.classList.add('ui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => document.body.classList.remove('ui'), 2000);
});
const appendixAt = slideEls.findIndex(s => (s.querySelector('.eyebrow') || {}).textContent === 'Appendix');
const progress = document.getElementById('progress');

slideEls.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'dot'; d.dataset.i = i;
  d.addEventListener('click', () => go(i));
  dots.appendChild(d);
});

// calculator constants/functions declared BEFORE go() runs
// Claude API list prices per MTok (Oct 2026). cache = cache-read price.
// Haiku 5.5 has a second rate card for prompts over 100K tokens.
const PRICES = {
  haiku:  { in: 0.10, out: 0.50, cache: 0.01, long: { above: 100000, in: 0.50, out: 2.50, cache: 0.05 } },
  sonnet: { in: 2.0,  out: 10.0, cache: 0.20 },
  opus:   { in: 4.0,  out: 20.0, cache: 0.20 },
  fable:  { in: 10.0, out: 50.0, cache: 0.25 }
};
let cacheRate = 0.9;
function fmt(n){
  if (n >= 1000) return '$' + n.toLocaleString(undefined,{maximumFractionDigits:0});
  if (n >= 10)   return '$' + n.toFixed(2);
  if (n >= 0.01) return '$' + n.toFixed(3);
  return '$' + n.toFixed(5);
}
function recalc(){
  const sel = document.getElementById('cModel');
  if (!sel) return;
  const tIn  = +document.getElementById('cIn').value || 0;
  const base = PRICES[sel.value];
  const m = base.long && tIn > base.long.above ? base.long : base;
  const tOut = +document.getElementById('cOut').value || 0;
  const req  = +document.getElementById('cReq').value || 0;
  const dev  = +document.getElementById('cDev').value || 0;

  const cachedIn = tIn * cacheRate;
  const freshIn  = tIn - cachedIn;
  const inCost   = (freshIn * m.in + cachedIn * m.cache) / 1e6;
  const outCost  = (tOut * m.out) / 1e6;
  const perReq   = inCost + outCost;
  const perDev   = perReq * req;
  const perMonth = perDev * 22;
  const team     = perMonth * dev;

  document.getElementById('rReq').textContent  = fmt(perReq);
  document.getElementById('rDev').textContent  = fmt(perDev);
  document.getElementById('rMon').textContent  = fmt(perMonth);
  document.getElementById('rTeam').textContent = fmt(team);

  const noCacheReq = (tIn * m.in + tOut * m.out) / 1e6;
  const noCacheTeam = noCacheReq * req * 22 * dev;
  const saved = noCacheTeam - team;
  const pct = noCacheTeam ? Math.round((saved / noCacheTeam) * 100) : 0;
  document.getElementById('rSav').innerHTML =
    `At <b>${Math.round(cacheRate*100)}%</b> cache hit rate you save <b>${fmt(saved)}/mo</b> (<b>${pct}%</b>) vs no caching. ` +
    `For scale: Anthropic reports ~$13 per developer per active day for Claude Code.`;
}

// presenter view + sync between the audience and presenter windows
if (isPresenter) document.body.classList.add('presenter');
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('context-budget-deck') : null;
function send(msg){
  if (chan) chan.postMessage(msg);
  try { localStorage.setItem('context-budget-deck', JSON.stringify({ ...msg, ts: Date.now() })); } catch (e) {}
}
function receive(msg){
  if (!msg) return;
  if (msg.hello) { if (!isPresenter) send({ i: idx, cues: cuesOn }); return; }
  if (typeof msg.cues === 'boolean' && msg.cues !== cuesOn) setCues(msg.cues, true);
  if (typeof msg.i === 'number' && msg.i !== idx) go(msg.i, true);
}

// demo cues on the slides: D toggles them in both windows; the presenter view always shows them
let cuesOn = true;
try { cuesOn = localStorage.getItem('context-budget-cues') !== 'off'; } catch (e) {}
const isPrint = new URLSearchParams(location.search).has('print');   // tools/scripts/export-pdf.*
if (isPrint) cuesOn = false;
function setCues(on, remote){
  cuesOn = on;
  document.body.classList.toggle('no-cues', !on);
  const s = document.getElementById('pCues');
  if (s) s.textContent = on ? 'on' : 'off';
  if (!isPrint) try { localStorage.setItem('context-budget-cues', on ? 'on' : 'off'); } catch (e) {}
  if (!remote) send({ cues: on });
  fitAll();
}
setCues(cuesOn, true);
// Cmd+P from the browser: drop the cue strips and re-fit for the PDF, then restore
addEventListener('beforeprint', () => { document.body.classList.add('no-cues'); fitAll(); });
addEventListener('afterprint', () => { document.body.classList.toggle('no-cues', !cuesOn); fitAll(); });
const KIND = { live: '▶ live', recorded: '▶ recording', show: 'show' };
function copyText(text){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(fallback);
  fallback(); return Promise.resolve();
}
document.addEventListener('click', e => {
  const say = e.target.closest && e.target.closest('#pDemo .say');
  if (!say) return;
  copyText(say.textContent).then(() => {
    say.classList.add('copied');
    setTimeout(() => say.classList.remove('copied'), 900);
  });
});
if (chan) chan.onmessage = e => receive(e.data);
window.addEventListener('storage', e => {
  if (e.key !== 'context-budget-deck' || !e.newValue) return;
  try { receive(JSON.parse(e.newValue)); } catch (err) {}
});

let t0 = null;
const toSec = cue => { const [m, s] = cue.split(':').map(Number); return m * 60 + s; };
const mmss = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
const titleOf = el => {
  const h = el && el.querySelector('h2,h1');
  if (!h) return '';
  const c = h.cloneNode(true);
  c.querySelectorAll('br').forEach(br => br.replaceWith(' '));
  return c.textContent.trim();
};
function renderPresenter(){
  if (!isPresenter) return;
  const el = slideEls[idx], next = slideEls[idx + 1];
  document.getElementById('pTitle').textContent = (idx + 1) + '. ' + titleOf(el);
  const nextDemo = next && next.querySelector('.demo');
  const nextCue = nextDemo ? '  ·  ' + KIND[nextDemo.dataset.kind] + ' ' + ((nextDemo.querySelector('.cue b') || {}).textContent || '') : '';
  document.getElementById('pNext').textContent = next ? 'Next: ' + titleOf(next) + nextCue : 'Last slide';
  const demo = el.querySelector('.demo'), pDemo = document.getElementById('pDemo');
  pDemo.innerHTML = demo ? demo.innerHTML : '';
  if (demo) pDemo.dataset.kind = demo.dataset.kind; else delete pDemo.dataset.kind;
  pDemo.classList.toggle('on', !!demo);
  const notes = el.querySelector('.notes');
  document.getElementById('pNotes').innerHTML = notes ? notes.innerHTML : '<i>No notes</i>';
  tick();
}
function tick(){
  if (!isPresenter) return;
  const elapsed = t0 ? (Date.now() - t0) / 1000 : 0;
  document.getElementById('pTimer').textContent = mmss(elapsed);
  const cue = slideEls[idx].dataset.cue, c = document.getElementById('pCue');
  c.textContent = cue ? 'leave this slide by ' + cue : '';
  c.className = cue ? (elapsed > toSec(cue) ? 'late' : 'ok') : '';
}
setInterval(tick, 1000);

let idx = 0;
function go(i, remote){
  idx = Math.max(0, Math.min(slideEls.length - 1, i));
  slideEls.forEach((el,j) => el.classList.toggle('active', j === idx));
  [...dots.children].forEach((d,j) => d.classList.toggle('active', j === idx));
  cur.textContent = idx + 1;
  progress.style.width = Math.min(100, idx / Math.max(1, appendixAt - 1) * 100) + '%';
  if (idx > 0 && t0 === null) t0 = Date.now();
  recalc();
  renderPresenter();
  if (!remote) send({ i: idx });
}
go(0, true);
if (isPresenter) send({ hello: true });

document.getElementById('prev').onclick = () => go(idx - 1);
document.getElementById('next').onclick = () => go(idx + 1);
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slideEls.length - 1);
  else if (e.key.toLowerCase() === 'p' && !isPresenter) window.open(location.pathname + '?presenter', 'deck-presenter', 'width=1100,height=760');
  else if (e.key.toLowerCase() === 't' && isPresenter) { t0 = Date.now(); tick(); }
  else if (e.key.toLowerCase() === 'd') setCues(!cuesOn);
  else if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

document.addEventListener('input',  e => { if (['cModel','cIn','cOut','cReq','cDev'].includes(e.target.id)) recalc(); });
document.addEventListener('change', e => { if (['cModel','cIn','cOut','cReq','cDev'].includes(e.target.id)) recalc(); });
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.cache !== undefined) {
    cacheRate = parseFloat(e.target.dataset.cache);
    document.querySelectorAll('.toggle-row button').forEach(b => b.classList.remove('on'));
    e.target.classList.add('on');
    recalc();
  }
});
</script>
</body>
</html>
