<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GitHub Copilot, end-to-end</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root{
  color-scheme:light;
  --cp-bg:#f7f4ef; --cp-bg-elevated:#fcfbf8; --cp-surface:#ffffff; --cp-surface-soft:#f5f5f5;
  --cp-border:#dedede; --cp-border-strong:#919191;
  --cp-text:#242424; --cp-text-muted:#5c5c5c; --cp-text-soft:#6f6f6f;
  --cp-accent:#b11f4b; --cp-accent-hover:#9a1a41; --cp-accent-soft:rgba(177,31,75,0.08);
  --cp-accent-fg:#ffffff;
  --cp-success:#16a34a; --cp-danger:#dc2626; --cp-warning:#f59e0b; --cp-link:#0078d4;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.12);
  --cp-overlay:rgba(255,255,255,0.8); --cp-panel:rgba(255,255,255,0.86);
  --cp-panel-strong:rgba(255,255,255,0.96); --cp-sheen:rgba(255,255,255,0.55);
  --cp-highlight:rgba(177,31,75,0.12);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --cp-bg:#3d3b3a; --cp-bg-elevated:#343231; --cp-surface:#292929; --cp-surface-soft:#2e2e2e;
  --cp-border:#474747; --cp-border-strong:#5f5f5f;
  --cp-text:#dedede; --cp-text-muted:#919191; --cp-text-soft:#b0b0b0;
  --cp-accent:#fd8ea1; --cp-accent-hover:#fb7b91; --cp-accent-soft:rgba(253,142,161,0.14);
  --cp-accent-fg:#1a1a1a;
  --cp-success:#4ade80; --cp-danger:#f87171; --cp-warning:#fbbf24; --cp-link:#4da6ff;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.32);
  --cp-overlay:rgba(41,41,41,0.88); --cp-panel:rgba(41,41,41,0.72);
  --cp-panel-strong:rgba(41,41,41,0.96); --cp-sheen:rgba(255,255,255,0.04);
  --cp-highlight:rgba(253,142,161,0.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--cp-bg);color:var(--cp-text);
  font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;}
code,pre,kbd{font-family:Consolas,"Courier New",Courier,monospace}
.deck{height:100vh;display:flex;flex-direction:column}
.stage{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:48px 72px 96px;overflow:auto;display:none;flex-direction:column;animation:fade .25s ease}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--cp-accent);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;margin-bottom:12px}
h1{font-size:44px;margin:0 0 12px;line-height:1.1}
h2{font-size:34px;margin:0 0 18px;line-height:1.15}
h3{font-size:20px;margin:18px 0 8px}
p{font-size:17px;line-height:1.55;color:var(--cp-text);margin:0 0 12px}
.lead{font-size:20px;color:var(--cp-text-muted);max-width:900px}
ul{margin:0 0 12px 0;padding-left:22px}
li{margin:6px 0;line-height:1.5}
small,.muted{color:var(--cp-text-muted)}
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:16px;padding:20px;box-shadow:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14)}
.card h3{margin-top:0;color:var(--cp-accent)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cp-accent-soft);color:var(--cp-accent);font-size:12px;font-weight:600;margin-right:6px}
.kbd{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:6px;padding:1px 6px;font-size:13px}
pre{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:10px;padding:14px 16px;overflow:auto;font-size:13.5px;line-height:1.5;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--cp-bg-elevated);border-top:1px solid var(--cp-border)}
.bar .nav{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;background:var(--cp-surface);color:var(--cp-text);border:1px solid var(--cp-border);border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--cp-border-strong)}
button.primary{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent)}
button.primary:hover{background:var(--cp-accent-hover);border-color:var(--cp-accent-hover)}
.counter{font-variant-numeric:tabular-nums;color:var(--cp-text-muted);font-size:13px}
.title-slide{align-items:center;justify-content:center;text-align:center}
.title-slide h1{font-size:60px;line-height:1.05;margin-bottom:18px}
.title-slide .lead{font-size:22px}
.metric{font-size:42px;font-weight:700;color:var(--cp-accent);line-height:1}
.metric small{display:block;font-size:13px;color:var(--cp-text-muted);font-weight:500;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--cp-border)}
th{color:var(--cp-text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:var(--cp-surface-soft)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.flow .step{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.flow .arrow{color:var(--cp-accent);font-weight:700}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.pill{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:999px;padding:6px 12px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.good{border-left:4px solid var(--cp-success)}
.bad{border-left:4px solid var(--cp-danger)}
.warn{border-left:4px solid var(--cp-warning)}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cp-border)}
.dot.active{background:var(--cp-accent)}
.loop{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0;flex-wrap:wrap}
.loop .node{background:var(--cp-surface);border:2px solid var(--cp-accent);border-radius:14px;padding:14px 18px;font-weight:600;text-align:center;min-width:130px}
.loop .arr{color:var(--cp-accent);font-size:24px;font-weight:700}
.hand{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;gap:8px;align-items:center;margin:14px 0}
.hand .ag{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:12px;padding:14px;text-align:center}
.hand .ag.lead{border-color:var(--cp-accent)}
.hand .ar{text-align:center;color:var(--cp-accent);font-size:22px;font-weight:700}
.theme-toggle{position:absolute;top:14px;right:18px;z-index:10}
.calc{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:8px}
.calc .controls label{display:block;font-size:13px;color:var(--cp-text-muted);margin:10px 0 4px;font-weight:600}
.calc .controls input,.calc .controls select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--cp-border);background:var(--cp-surface);color:var(--cp-text);font-family:inherit;font-size:14px}
.calc .controls input:focus,.calc .controls select:focus{outline:none;border-color:var(--cp-accent)}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .results{display:flex;flex-direction:column;gap:10px}
.calc .res-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:10px}
.calc .res-row .lbl{font-size:13px;color:var(--cp-text-muted)}
.calc .res-row .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--cp-text)}
.calc .res-row.total{background:var(--cp-accent-soft);border-color:var(--cp-accent)}
.calc .res-row.total .val{color:var(--cp-accent);font-size:24px}
.calc .savings{padding:12px 14px;background:var(--cp-surface);border:1px solid var(--cp-border);border-left:4px solid var(--cp-success);border-radius:10px;font-size:14px;line-height:1.5}
.calc .savings b{color:var(--cp-success)}
.copilot-badge{display:inline-block;background:#24292e;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.04em}
html[data-theme="dark"] .copilot-badge{background:#fff;color:#24292e}

/* ---------- ?print=1 layout ---------- */
@page{size:A4 landscape;margin:0}
html.print-mode,html.print-mode body{height:auto;overflow:visible}
html.print-mode .deck{height:auto;display:block}
html.print-mode .stage{overflow:visible;position:static;height:auto}
html.print-mode .bar,html.print-mode .theme-toggle{display:none!important}
html.print-mode .slide{position:static!important;display:flex!important;
  width:100%;height:100vh;page-break-after:always;break-after:page;
  overflow:hidden;animation:none}
html.print-mode .slide:last-child{page-break-after:auto;break-after:auto}
html.print-mode .refs-slide{padding:36px 56px 64px}
html.print-mode .refs-slide h2{font-size:30px;margin-bottom:12px}
html.print-mode .refs-slide .card{padding:16px}
html.print-mode .refs-slide li{font-size:14px;line-height:1.35;margin:4px 0}
</style>
</head>
<body>
<div class="deck">
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">◐</button>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="counter"><span id="cur">1</span> / <span id="total">1</span></div>
    <div class="nav">
      <button id="prev">← Prev</button>
      <button class="primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const slides = [
  // 1
  `<section class="slide title-slide">
    <div class="eyebrow">Technical Session · <span class="copilot-badge">GitHub Copilot</span></div>
    <h1>GitHub Copilot, end-to-end</h1>
    <p class="lead">Using Copilot effectively across the IDE, the CLI, and the cloud coding agent — with the practices that make any of them stick.</p>
    <div style="margin-top:30px;color:var(--cp-text-muted);font-size:13px">Use ← → or Space to navigate · Press <span class="kbd">F</span> for fullscreen</div>
  </section>`,

  // 2
  `<section class="slide">
    <div class="eyebrow">Set the stage</div>
    <h2>One developer, three surfaces</h2>
    <p class="lead">Most teams use Copilot like an autocomplete. The leverage sits in <b>knowing which surface to reach for</b> — and what to put in front of it.</p>
    <div class="grid cols-3" style="margin-top:18px">
      <div class="card"><h3>💻 IDE</h3><p>Synchronous. You're at the wheel. Chat, edits, agent mode in VS Code.</p><p class="muted">Best for: writing code with you, in the loop.</p></div>
      <div class="card"><h3>🖥 CLI</h3><p>Terminal-native. Scriptable. Pairs with your existing dev loop.</p><p class="muted">Best for: shell answers, scripting Copilot into pipelines.</p></div>
      <div class="card"><h3>☁️ Cloud agent</h3><p>Asynchronous. Assign an issue, Copilot opens a PR. You review.</p><p class="muted">Best for: well-scoped tasks while you do other work.</p></div>
    </div>
    <p class="muted" style="margin-top:14px">Same model family. Very different operating models.</p>
  </section>`,

  // 3
  `<section class="slide">
    <div class="eyebrow">Know your surfaces</div>
    <h2>Where Copilot reads context</h2>
    <table>
      <thead><tr><th>Surface</th><th>What it sends</th><th>Token weight</th></tr></thead>
      <tbody>
        <tr><td><b>Inline completions</b> (ghost text)</td><td>Open file + nearby files (neighboring tabs)</td><td>Light · auto-managed</td></tr>
        <tr><td><b>Copilot Chat</b></td><td>Active file, selection, attached <span class="kbd">#file</span>/<span class="kbd">#selection</span>, history</td><td>Medium · you control it</td></tr>
        <tr><td><b>Agent mode (broad retrieval)</b></td><td>Indexed repo chunks via retrieval + tool calls</td><td>Heavy · scales with repo size</td></tr>
        <tr><td><b>Edits / Agent mode</b></td><td>Working set + tool calls + multi-turn loop</td><td>Heaviest · multiplies per iteration</td></tr>
        <tr><td><b>Coding agent (cloud)</b></td><td>Issue + repo + CI logs across many turns</td><td>Heavy · long-running</td></tr>
        <tr><td><b>Copilot CLI</b></td><td>Shell context + files you reference</td><td>Light–medium</td></tr>
      </tbody>
    </table>
    <p class="muted" style="margin-top:14px">Different surface, different optimization. Treat them differently.</p>
  </section>`,

  // 4
  `<section class="slide">
    <div class="eyebrow">Agenda · 45 min</div>
    <h2>What we'll cover</h2>
    <div class="grid cols-2">
      <div class="card"><span class="tag">8 min</span><h3>IDE essentials + Demo</h3><p>Chat variables, agent mode, custom instructions, prompt files, an MCP server.</p></div>
      <div class="card"><span class="tag">15 min</span><h3>Cloud coding agent + Demo ⭐</h3><p>Assign an issue → Copilot opens a PR → review loop. AGENTS.md, guardrails, <span class="kbd">gh aw</span> orchestration.</p></div>
      <div class="card"><span class="tag">6 min</span><h3>Copilot CLI + Demo</h3><p><span class="kbd">gh copilot suggest</span> / <span class="kbd">explain</span> and scripting Copilot into your dev loop.</p></div>
      <div class="card"><span class="tag">11 min</span><h3>Cross-cutting + adoption</h3><p>Context is a budget · model routing · Phase 1→3 rollout · <span class="kbd">awesome-copilot</span>.</p></div>
    </div>
  </section>`,

  // 5
  `<section class="slide">
    <div class="eyebrow">Demo 1 · 8 min</div>
    <h2>IDE essentials — live</h2>
    <p class="lead">Same task, three ways. Watch the context, the model, and the outcome.</p>
    <div class="grid cols-3" style="margin-top:14px">
      <div class="card"><h3>1 · Broad vs scoped</h3><ul><li>Agent mode, no scoping</li><li>Same question with <span class="kbd">#file</span> + <span class="kbd">#selection</span></li><li>Compare turns + token weight</li></ul></div>
      <div class="card"><h3>2 · Codify it</h3><ul><li>Add <span class="kbd">.github/copilot-instructions.md</span></li><li>Scope with <span class="kbd">*.instructions.md</span></li><li>Re-run · watch behavior shift</li></ul></div>
      <div class="card"><h3>3 · Reuse it</h3><ul><li>Promote to a <span class="kbd">.prompt.md</span> file</li><li>Invoke as a slash command</li><li>Mention an MCP server tool</li></ul></div>
    </div>
    <p class="muted" style="margin-top:14px">Source: <span class="kbd">ai-token-management/demos/01</span> + <span class="kbd">04</span>.</p>
  </section>`,

  // 6
  `<section class="slide">
    <div class="eyebrow">Lever A</div>
    <h2>Scoped context — the #1 Copilot win</h2>
    <p class="lead">Most teams overuse broad retrieval (Agent mode for simple questions). It's powerful but expensive. Reach for sharper variables first.</p>
    <div class="grid cols-2">
      <div class="card good">
        <h3>✅ Use targeted variables</h3>
        <ul>
          <li><span class="kbd">#file:src/api/orders.ts</span> — exactly the file</li>
          <li><span class="kbd">#selection</span> — only what's highlighted</li>
          <li><span class="kbd">#editor</span> — visible portion only</li>
          <li><span class="kbd">#terminalLastCommand</span> / <span class="kbd">#terminalSelection</span></li>
          <li><span class="kbd">#problems</span> — the diagnostics, not the whole file</li>
          <li><span class="kbd">#fetch:&lt;url&gt;</span> — pull docs on demand</li>
          <li><span class="kbd">#changes</span> — git diff vs base</li>
        </ul>
      </div>
      <div class="card bad">
        <h3>❌ Don't reflexively reach for</h3>
        <ul>
          <li>Agent mode + a one-line question — retrieves & dumps a lot of context</li>
          <li><span class="kbd">#codebase</span> when one <span class="kbd">#file</span> would do</li>
          <li>Pasting whole stack traces — use <span class="kbd">#problems</span> or trim</li>
          <li>"Look at all the test files" — attach the one you mean</li>
        </ul>
      </div>
    </div>
  </section>`,

  // 7
  `<section class="slide">
    <div class="eyebrow">Lever B</div>
    <h2>Custom instructions — codify it once</h2>
    <p class="lead">Anything you tell Copilot in <i>every</i> chat belongs in an instructions file. It loads automatically — no tokens spent re-typing.</p>
    <div class="grid cols-2">
      <div class="card">
        <h3>Repo-wide</h3>
        <pre>.github/copilot-instructions.md</pre>
        <p>Build/test/lint commands, naming conventions, "be concise, no preamble", which dirs to ignore, output style. Auto-applied to every chat in the repo.</p>
      </div>
      <div class="card">
        <h3>Scoped (path-targeted)</h3>
<pre>.github/instructions/react.instructions.md
---
applyTo: "src/**/*.tsx"
---
Use functional components.
Prefer hooks over HOCs.
Tests live next to the component.</pre>
        <p>Loaded only when files matching the glob are in context. Smaller per-turn footprint.</p>
      </div>
    </div>
    <p class="muted" style="margin-top:12px">Personal-level instructions live in VS Code settings — use these for your style preferences, not team standards.</p>
  </section>`,

  // 8
  `<section class="slide">
    <div class="eyebrow">Lever C</div>
    <h2>Prompt files — reusable, parameterized</h2>
    <p class="lead">For repeating tasks (write a test, scaffold a route, run a migration), a saved <span class="kbd">.prompt.md</span> beats re-typing the same prompt every time.</p>
    <div class="grid cols-2">
      <div class="card">
        <h3>Where they live</h3>
        <pre>.github/prompts/new-endpoint.prompt.md</pre>
        <p>Run with <span class="kbd">/new-endpoint</span> in chat. Versioned with the repo so the whole team uses the same recipe.</p>
      </div>
      <div class="card">
        <h3>Why it saves tokens</h3>
        <ul>
          <li>One canonical prompt → consistent prefix → better cache hit rate.</li>
          <li>Encodes "do this <i>exactly</i> this way" — model doesn't wander, fewer retries.</li>
          <li>Embeds <span class="kbd">#file</span> references, so context is curated once.</li>
          <li>Ship them in your repo template; new devs are productive on day one.</li>
        </ul>
      </div>
    </div>
  </section>`,

  // 9
  `<section class="slide title-slide">
    <div class="eyebrow">Marquee segment · 15 min</div>
    <h1>The cloud coding agent</h1>
    <p class="lead">Async Copilot. Assign an issue, get a pull request.</p>
  </section>`,

  // 10
  `<section class="slide">
    <div class="eyebrow">What it is</div>
    <h2>Copilot coding agent — the mental model</h2>
    <div class="grid cols-2">
      <div class="card">
        <h3>Async, not in your editor</h3>
        <p>You file or pick an issue → assign it to Copilot → Copilot creates a branch, plans, edits, opens a PR. You review on github.com or in your IDE.</p>
      </div>
      <div class="card">
        <h3>Lives inside your GitHub</h3>
        <p>Runs as a GitHub Action with scoped permissions. PRs follow the same review rules as any teammate's: branch protection, CODEOWNERS, CI, the lot.</p>
      </div>
      <div class="card">
        <h3>Good fits</h3>
        <ul><li>Bug fix with a clear repro</li><li>Dependency bumps, codemods</li><li>Test coverage on a focused area</li><li>"Apply this pattern across N files"</li></ul>
      </div>
      <div class="card">
        <h3>Bad fits</h3>
        <ul><li>Ambiguous design work</li><li>Tasks that need lots of human judgment</li><li>Anything you can't describe in an issue someone else could pick up</li></ul>
      </div>
    </div>
  </section>`,

  // 11
  `<section class="slide">
    <div class="eyebrow">The flow</div>
    <h2>From issue to merge — what happens</h2>
    <table>
      <thead><tr><th>Step</th><th>Where</th><th>What you do · what it does</th></tr></thead>
      <tbody>
        <tr><td>1 · Frame the task</td><td>Issue body</td><td>Write it like a task for a new teammate: context, acceptance criteria, scope guardrails.</td></tr>
        <tr><td>2 · Assign Copilot</td><td>Issue assignee</td><td>Copilot reacts in seconds; a draft PR + branch get created.</td></tr>
        <tr><td>3 · Plan & explore</td><td>PR description</td><td>Copilot posts its plan and what it'll touch. You can comment to redirect.</td></tr>
        <tr><td>4 · Edit & test</td><td>Action runner</td><td>Runs in an ephemeral environment. CI runs on the PR like any other.</td></tr>
        <tr><td>5 · Review iterate</td><td>PR comments</td><td>Treat it like a junior PR. Comments on diffs → new commits.</td></tr>
        <tr><td>6 · Merge</td><td>Same as always</td><td>Branch protection, required reviews, CODEOWNERS all still apply.</td></tr>
      </tbody>
    </table>
    <p class="muted" style="margin-top:12px">You don't lose control — you just shift from author to reviewer.</p>
  </section>`,

  // 12
  `<section class="slide">
    <div class="eyebrow">Repo prerequisites</div>
    <h2>What your repo needs before you assign anything</h2>
    <div class="grid cols-2">
      <div class="card good">
        <h3>✅ Must-have</h3>
        <ul>
          <li><span class="kbd">AGENTS.md</span> or <span class="kbd">.github/copilot-instructions.md</span> — build/test/lint commands, conventions, what NOT to touch</li>
          <li>CI that actually catches problems (tests, lint, type-check)</li>
          <li>Branch protection + required PR review</li>
          <li>Clear issue templates (so prompts are uniform)</li>
        </ul>

  if (n >= 1000) return n.toLocaleString(undefined,{maximumFractionDigits:0});
  if (n >= 10)   return n.toFixed(1);
  return n.toFixed(2);

function recalc(){

  document.getElementById('rDay').textContent  = fmt(reqsPerDayPerDev);
  document.getElementById('rMon').textContent  = fmt(reqsPerMonth);
  document.getElementById('rPct').textContent  = quota ? pct + '%' : '—';
  document.getElementById('rTeam').textContent = fmt(team);

  } else if (pct > 100) {

    document.documentElement.setAttribute('data-theme', c === 'dark' ? 'light' : 'dark');

  document.addEventListener('input', e => { if (['cModel','cReq','cAgent','cTurns','cDev','cPlan'].includes(e.target.id)) recalc(); });
  document.addEventListener('change', e => { if (['cModel','cReq','cAgent','cTurns','cDev','cPlan'].includes(e.target.id)) recalc(); });
}
</script>
