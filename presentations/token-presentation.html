<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Context Is a Budget</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root{
  color-scheme:light;
  --cp-bg:#f7f4ef; --cp-bg-elevated:#fcfbf8; --cp-surface:#ffffff; --cp-surface-soft:#f5f5f5;
  --cp-border:#dedede; --cp-border-strong:#919191;
  --cp-text:#242424; --cp-text-muted:#5c5c5c; --cp-text-soft:#6f6f6f;
  --cp-accent:#b11f4b; --cp-accent-hover:#9a1a41; --cp-accent-soft:rgba(177,31,75,0.08);
  --cp-accent-fg:#ffffff;
  --cp-success:#16a34a; --cp-danger:#dc2626; --cp-warning:#f59e0b; --cp-link:#0078d4;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.12);
  --cp-overlay:rgba(255,255,255,0.8); --cp-panel:rgba(255,255,255,0.86);
  --cp-panel-strong:rgba(255,255,255,0.96); --cp-sheen:rgba(255,255,255,0.55);
  --cp-highlight:rgba(177,31,75,0.12);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --cp-bg:#3d3b3a; --cp-bg-elevated:#343231; --cp-surface:#292929; --cp-surface-soft:#2e2e2e;
  --cp-border:#474747; --cp-border-strong:#5f5f5f;
  --cp-text:#dedede; --cp-text-muted:#919191; --cp-text-soft:#b0b0b0;
  --cp-accent:#fd8ea1; --cp-accent-hover:#fb7b91; --cp-accent-soft:rgba(253,142,161,0.14);
  --cp-accent-fg:#1a1a1a;
  --cp-success:#4ade80; --cp-danger:#f87171; --cp-warning:#fbbf24; --cp-link:#4da6ff;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.32);
  --cp-overlay:rgba(41,41,41,0.88); --cp-panel:rgba(41,41,41,0.72);
  --cp-panel-strong:rgba(41,41,41,0.96); --cp-sheen:rgba(255,255,255,0.04);
  --cp-highlight:rgba(253,142,161,0.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--cp-bg);color:var(--cp-text);
  font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;}
code,pre,kbd{font-family:Consolas,"Courier New",Courier,monospace}

.deck{height:100vh;display:flex;flex-direction:column}
.stage{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:48px 72px 72px;overflow:auto;
  display:none;flex-direction:column;animation:fade .25s ease}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{color:var(--cp-accent);text-transform:uppercase;letter-spacing:.12em;
  font-size:12px;font-weight:700;margin-bottom:12px}
h1{font-size:44px;margin:0 0 12px;line-height:1.1}
h2{font-size:38px;margin:0 0 18px;line-height:1.15}
h3{font-size:20px;margin:18px 0 8px}
p{font-size:19px;line-height:1.5;color:var(--cp-text);margin:0 0 12px}
.lead{font-size:22px;color:var(--cp-text-muted);max-width:1000px}
ul{margin:0 0 12px 0;padding-left:22px}
li{margin:6px 0;line-height:1.45;font-size:18px}
small,.muted{color:var(--cp-text-muted)}

.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}

.card{background:var(--cp-surface);border:1px solid var(--cp-border);
  border-radius:16px;padding:20px;box-shadow:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14)}
.card h3{margin-top:0;color:var(--cp-accent)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cp-accent-soft);color:var(--cp-accent);font-size:12px;font-weight:600;
  margin-right:6px}

.kbd{background:var(--cp-surface-soft);border:1px solid var(--cp-border);
  border-radius:6px;padding:1px 6px;font-size:.85em}

pre{background:var(--cp-surface-soft);border:1px solid var(--cp-border);
  border-radius:10px;padding:14px 16px;overflow:auto;font-size:15px;line-height:1.5;margin:0}

.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
  background:var(--cp-bg-elevated);border-top:1px solid var(--cp-border)}
.bar .nav{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;background:var(--cp-surface);
  color:var(--cp-text);border:1px solid var(--cp-border);border-radius:10px;
  padding:8px 14px;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--cp-border-strong)}
button.primary{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent)}
button.primary:hover{background:var(--cp-accent-hover);border-color:var(--cp-accent-hover)}
.counter{font-variant-numeric:tabular-nums;color:var(--cp-text-muted);font-size:13px}

.title-slide{align-items:center;justify-content:center;text-align:center}
.title-slide h1{font-size:64px;line-height:1.05;margin-bottom:18px}
.title-slide .lead{font-size:22px}

.metric{font-size:42px;font-weight:700;color:var(--cp-accent);line-height:1}
.metric small{display:block;font-size:13px;color:var(--cp-text-muted);
  font-weight:500;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}

table{width:100%;border-collapse:collapse;font-size:16.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--cp-border)}
th{color:var(--cp-text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:var(--cp-surface-soft)}

.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.flow .step{background:var(--cp-surface);border:1px solid var(--cp-border);
  border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.flow .arrow{color:var(--cp-accent);font-weight:700}

.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.pill{background:var(--cp-surface-soft);border:1px solid var(--cp-border);
  border-radius:999px;padding:6px 12px;font-size:13px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid>*,.split>*{min-width:0}
.good{border-left:4px solid var(--cp-success)}
.bad{border-left:4px solid var(--cp-danger)}
.warn{border-left:4px solid var(--cp-warning)}

.footer{position:absolute;bottom:14px;right:24px;font-size:12px;color:var(--cp-text-muted)}

/* progress dots */
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cp-border)}
.dot.active{background:var(--cp-accent)}

/* loop diagram */
.loop{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0;flex-wrap:wrap}
.loop .node{background:var(--cp-surface);border:2px solid var(--cp-accent);
  border-radius:14px;padding:14px 18px;font-weight:600;text-align:center;min-width:130px}
.loop .arr{color:var(--cp-accent);font-size:24px;font-weight:700}

.hand{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;gap:8px;align-items:center;margin:14px 0}
.hand .ag{background:var(--cp-surface);border:1px solid var(--cp-border);
  border-radius:12px;padding:14px;text-align:center}
.hand .ag.lead{border-color:var(--cp-accent)}
.hand .ar{text-align:center;color:var(--cp-accent);font-size:22px;font-weight:700}

.theme-toggle{position:absolute;top:14px;right:18px;z-index:10}

/* new slide components */
.slide .notes{display:none}
.measure{display:inline-block;border:2px dashed var(--cp-warning);border-radius:8px;padding:0 8px;color:var(--cp-warning)}
.feature{font-size:21px;padding:14px 18px;border-radius:12px;background:var(--cp-accent-soft);border-left:4px solid var(--cp-accent)}
.card .metric{margin-top:14px}
.card.pattern{border-style:dashed}
.card h3:only-of-type:last-child{margin-bottom:0}
pre.meter{font-size:20px;margin-top:6px}
table.compact{font-size:15px}
table.compact td,table.compact th{padding:7px 10px}
tr.total-row td{font-weight:700;font-size:20px}
.qr svg{display:block;width:100%;height:100%}
.qr{background:#fff;padding:8px;border-radius:10px}
.qr-corner{position:absolute;right:28px;bottom:48px;width:130px;text-align:center}
.qr-corner small{display:block;margin-top:6px;font-size:11px;color:var(--cp-text-muted)}
.qr-big{display:flex;align-items:center;gap:24px;margin-top:22px;text-align:left}
.qr-big .qr{width:190px;height:190px}
.qr-big p{font-size:22px;margin:0}

/* presenter view: open with P, or ?presenter */
#presenter{display:none}
body.presenter .stage,body.presenter .theme-toggle{display:none}
body.presenter #presenter{display:flex;flex-direction:column;gap:14px;flex:1;padding:28px 40px;overflow:auto}
#presenter .p-top{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
#pTimer{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums}
#pCue{font-size:22px;font-variant-numeric:tabular-nums}
#pCue.ok{color:var(--cp-success)} #pCue.late{color:var(--cp-danger)}
#pTitle{font-size:30px;font-weight:700}
#pNext{font-size:18px;color:var(--cp-text-muted)}
#pNotes{font-size:26px;line-height:1.5;max-width:1100px}
#pHelp{font-size:13px;color:var(--cp-text-muted)}
a{color:var(--cp-link)}

/* calculator */
.calc{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:8px}
.calc .controls label{display:block;font-size:13px;color:var(--cp-text-muted);margin:10px 0 4px;font-weight:600}
.calc .controls input,.calc .controls select{width:100%;padding:9px 12px;border-radius:10px;
  border:1px solid var(--cp-border);background:var(--cp-surface);color:var(--cp-text);font-family:inherit;font-size:14px}
.calc .controls input:focus,.calc .controls select:focus{outline:none;border-color:var(--cp-accent)}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .results{display:flex;flex-direction:column;gap:10px}
.calc .res-row{display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 14px;background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:10px}
.calc .res-row .lbl{font-size:13px;color:var(--cp-text-muted)}
.calc .res-row .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--cp-text)}
.calc .res-row.total{background:var(--cp-accent-soft);border-color:var(--cp-accent)}
.calc .res-row.total .val{color:var(--cp-accent);font-size:24px}
.calc .savings{padding:12px 14px;background:var(--cp-surface);border:1px solid var(--cp-border);
  border-left:4px solid var(--cp-success);border-radius:10px;font-size:14px;line-height:1.5}
.calc .savings b{color:var(--cp-success)}
.toggle-row{display:flex;gap:8px;margin-top:6px}
.toggle-row button{flex:1;padding:8px}
.toggle-row button.on{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent)}
</style>
</head>
<body>
<div class="deck">
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">◐</button>
  <div class="stage" id="stage"></div>
  <div id="presenter">
    <div class="p-top"><div id="pTimer">0:00</div><div id="pCue"></div></div>
    <div id="pTitle"></div>
    <div id="pNext"></div>
    <div id="pNotes"></div>
    <div id="pHelp">← → navigate (both windows follow) · T restart timer · the audience window is the one you opened this from</div>
  </div>
  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="counter"><span id="cur">1</span> / <span id="total">1</span></div>
    <div class="nav">
      <button id="prev">← Prev</button>
      <button class="primary" id="next">Next →</button>
    </div>
  </div>
</div>

      </div>
    </div>
    <p class="muted" style="margin-top:14px">Claude API list prices (Oct 2026). Cache reads: 10% of input (Haiku, Sonnet), 5% (Opus 5.5), 2.5% (Fable 5.1); cache writes ignored. Copilot bills these same API rates since June 1.</p>
  </section>`,

  // 25 — anti-patterns
  `<section class="slide">

    <h2>Anti-patterns to stamp out</h2>

  // 26 — scaling up
  `<section class="slide">

    <h2>From one repo to a fleet of agents</h2>

const stage = document.getElementById('stage');
const dots  = document.getElementById('dots');
const cur   = document.getElementById('cur');
const tot   = document.getElementById('total');

stage.innerHTML = slides.join('');
const slideEls = [...stage.querySelectorAll('.slide')];
tot.textContent = slideEls.length;

slideEls.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'dot'; d.dataset.i = i;
  d.addEventListener('click', () => go(i));
  dots.appendChild(d);
});

// calculator constants/functions declared BEFORE go() runs
// Claude API list prices per MTok (Oct 2026). cache = cache-read price.
// Haiku 5.5 has a second rate card for prompts over 100K tokens.
const PRICES = {
  haiku:  { in: 0.10, out: 0.50, cache: 0.01, long: { above: 100000, in: 0.50, out: 2.50, cache: 0.05 } },
  sonnet: { in: 2.0,  out: 10.0, cache: 0.20 },
  opus:   { in: 4.0,  out: 20.0, cache: 0.20 },
  fable:  { in: 10.0, out: 50.0, cache: 0.25 }
};
let cacheRate = 0.9;
function fmt(n){
  if (n >= 1000) return '$' + n.toLocaleString(undefined,{maximumFractionDigits:0});
  if (n >= 10)   return '$' + n.toFixed(2);
  if (n >= 0.01) return '$' + n.toFixed(3);
  return '$' + n.toFixed(5);
}
function recalc(){
  const sel = document.getElementById('cModel');
  if (!sel) return;
  const tIn  = +document.getElementById('cIn').value || 0;
  const base = PRICES[sel.value];
  const m = base.long && tIn > base.long.above ? base.long : base;
  const tOut = +document.getElementById('cOut').value || 0;
  const req  = +document.getElementById('cReq').value || 0;
  const dev  = +document.getElementById('cDev').value || 0;

  const cachedIn = tIn * cacheRate;
  const freshIn  = tIn - cachedIn;
  const inCost   = (freshIn * m.in + cachedIn * m.cache) / 1e6;
  const outCost  = (tOut * m.out) / 1e6;
  const perReq   = inCost + outCost;
  const perDev   = perReq * req;
  const perMonth = perDev * 22;
  const team     = perMonth * dev;

  document.getElementById('rReq').textContent  = fmt(perReq);
  document.getElementById('rDev').textContent  = fmt(perDev);
  document.getElementById('rMon').textContent  = fmt(perMonth);
  document.getElementById('rTeam').textContent = fmt(team);

  const noCacheReq = (tIn * m.in + tOut * m.out) / 1e6;
  const noCacheTeam = noCacheReq * req * 22 * dev;
  const saved = noCacheTeam - team;
  const pct = noCacheTeam ? Math.round((saved / noCacheTeam) * 100) : 0;
  document.getElementById('rSav').innerHTML =
    `At <b>${Math.round(cacheRate*100)}%</b> cache hit rate you save <b>${fmt(saved)}/mo</b> (<b>${pct}%</b>) vs no caching. ` +
    `For scale: Anthropic reports ~$13 per developer per active day for Claude Code.`;
}

// presenter view + sync between the audience and presenter windows
const isPresenter = new URLSearchParams(location.search).has('presenter');
if (isPresenter) document.body.classList.add('presenter');
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('context-budget-deck') : null;
function send(msg){
  if (chan) chan.postMessage(msg);
  try { localStorage.setItem('context-budget-deck', JSON.stringify({ ...msg, ts: Date.now() })); } catch (e) {}
}
function receive(msg){
  if (!msg) return;
  if (msg.hello && !isPresenter) send({ i: idx });
  else if (typeof msg.i === 'number' && msg.i !== idx) go(msg.i, true);
}
if (chan) chan.onmessage = e => receive(e.data);
window.addEventListener('storage', e => {
  if (e.key !== 'context-budget-deck' || !e.newValue) return;
  try { receive(JSON.parse(e.newValue)); } catch (err) {}
});

let t0 = null;
const toSec = cue => { const [m, s] = cue.split(':').map(Number); return m * 60 + s; };
const mmss = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
const titleOf = el => {
  const h = el && el.querySelector('h2,h1');
  if (!h) return '';
  const c = h.cloneNode(true);
  c.querySelectorAll('br').forEach(br => br.replaceWith(' '));
  return c.textContent.trim();
};
function renderPresenter(){
  if (!isPresenter) return;
  const el = slideEls[idx], next = slideEls[idx + 1];
  document.getElementById('pTitle').textContent = (idx + 1) + '. ' + titleOf(el);
  document.getElementById('pNext').textContent = next ? 'Next: ' + titleOf(next) : 'Last slide';
  const notes = el.querySelector('.notes');
  document.getElementById('pNotes').innerHTML = notes ? notes.innerHTML : '<i>No notes</i>';
  tick();
}
function tick(){
  if (!isPresenter) return;
  const elapsed = t0 ? (Date.now() - t0) / 1000 : 0;
  document.getElementById('pTimer').textContent = mmss(elapsed);
  const cue = slideEls[idx].dataset.cue, c = document.getElementById('pCue');
  c.textContent = cue ? 'leave this slide by ' + cue : '';
  c.className = cue ? (elapsed > toSec(cue) ? 'late' : 'ok') : '';
}
setInterval(tick, 1000);

let idx = 0;
function go(i, remote){
  idx = Math.max(0, Math.min(slideEls.length - 1, i));
  slideEls.forEach((el,j) => el.classList.toggle('active', j === idx));
  [...dots.children].forEach((d,j) => d.classList.toggle('active', j === idx));
  cur.textContent = idx + 1;
  if (idx > 0 && t0 === null) t0 = Date.now();
  recalc();
  renderPresenter();
  if (!remote) send({ i: idx });
}
go(0, true);
if (isPresenter) send({ hello: true });

document.getElementById('prev').onclick = () => go(idx - 1);
document.getElementById('next').onclick = () => go(idx + 1);
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slideEls.length - 1);
  else if (e.key.toLowerCase() === 'p' && !isPresenter) window.open(location.pathname + '?presenter', 'deck-presenter', 'width=1100,height=760');
  else if (e.key.toLowerCase() === 't' && isPresenter) { t0 = Date.now(); tick(); }
  else if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

document.getElementById('themeToggle').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};

document.addEventListener('input',  e => { if (['cModel','cIn','cOut','cReq','cDev'].includes(e.target.id)) recalc(); });
document.addEventListener('change', e => { if (['cModel','cIn','cOut','cReq','cDev'].includes(e.target.id)) recalc(); });
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.cache !== undefined) {
    cacheRate = parseFloat(e.target.dataset.cache);
    document.querySelectorAll('.toggle-row button').forEach(b => b.classList.remove('on'));
    e.target.classList.add('on');
    recalc();
  }
});
</script>
</body>
